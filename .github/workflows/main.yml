name: CI with Cache

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache_step
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: cache-1aa106f

      - name: prime-cache-1aa106f
        run: |
          echo "Cache hit: ${{ steps.cache_step.outputs.cache-hit }}"
